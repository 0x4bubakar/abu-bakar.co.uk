<style>
    :root {
        --bg-color: #fcfaf7;
        --text-color: #2c2a29;
        --link-color: #9c4a23;
        --border-color: #e6e2d8;
        --surface-color: #f4f0eb;
        --shadow-color: rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #1c1a19;
            --text-color: #e6e1dc;
            --link-color: #d48357;
            --border-color: #383432;
            --surface-color: #242120;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }
    }

    html,
    body {
        height: 100%;
    }

    body {
        font-family: Tahoma, Verdana, Segoe UI, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        letter-spacing: -0.01em;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0 auto;
        max-width: 800px;
        padding: 0 1rem;
        background-color: var(--bg-color);
        color: var(--text-color);
    }

    /* Header & Menu */
    .menu {
        padding: 0;
    }

    .menu li {
        display: inline-block;
    }

    .article-meta,
    .menu a {
        background: var(--surface-color);
        color: var(--text-color);
        padding: 5px;
        border-radius: 5px;
        border: 1px solid var(--border-color);
    }

    .menu,
    .article-meta,
    footer {
        text-align: center;
    }

    .title {
        font-size: 1.1em;
    }

    footer a {
        text-decoration: none;
    }

    hr {
        border: none;
        border-top: 1px dashed var(--border-color);
    }

    /* Tables */
    table {
        margin: auto;
        border-collapse: collapse;
        border-top: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
    }

    table thead th {
        border-bottom: 1px solid var(--border-color);
    }

    th,
    td {
        padding: 8px 12px;
    }

    thead,
    tfoot,
    tr:nth-child(even) {
        background: var(--surface-color);
    }

    /* Typography & Links */
    a {
        color: var(--link-color);
    }

    footer {
        margin-top: auto;
        padding-bottom: 2rem;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        font-family: Tahoma, Verdana, sans-serif;
        font-weight: bold;
        letter-spacing: 0;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
    }

    /* Miscellaneous elements */
    img,
    iframe,
    video {
        max-width: 100%;
    }

    main {
        hyphens: auto;
    }

    blockquote {
        background: var(--surface-color);
        border-left: 5px solid var(--link-color);
        padding: 3px 1em 3px;
        margin: 1em 0;
    }

    /* Banner Container & Centered Watermark Title */
    .blog-banner-container {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 4.5 / 1;
        margin: 0.2em auto 0.5em auto;
        overflow: hidden;
        border: 1px solid var(--border-color);
        border-radius: 4px;
    }

    img.blog-banner {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: brightness(0.85) contrast(1.1);
        display: block;
    }

    .banner-watermark {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(15, 15, 15, 0.9);
        border: 1px solid var(--border-color);
        color: var(--link-color);
        font-family: "Lucida Console", "Courier New", monospace;
        font-weight: bold;
        padding: 4px 14px;
        letter-spacing: 1px;
        white-space: nowrap;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    /* Inline Code Styling */
    :not(pre)>code {
        background-color: var(--surface-color);
        color: var(--text-color);
        padding: 0.2em 0.4em;
        font-size: 0.85em;
        border: 1px solid var(--border-color);
        border-radius: 3px;
    }

    /* Ensure fenced code blocks (inside <pre>) are unaffected */
    pre code {
        background-color: transparent;
        border: none;
        padding: 0;
    }

    pre {
        box-shadow: none;
    }
</style>
