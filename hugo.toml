baseURL = 'https://abu-bakar.co.uk/'
languageCode = 'en-gb'
title = "Abu Bakar's Blog"
theme = 'xmin'
author = "0x4bubakar"
description = "Security research, embedded systems development, and related musings."

[permalinks]
  posts = "/posts/:slug"

[params]
  footer = "&copy; 2026 abu-bakar.co.uk - all rights reserved | Built with <3 using [Hugo](https://gohugo.io/) and Yihui Xie's [XMin](https://xmin.yihui.org/) theme."

[menu]

  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "Categories"
    url = "/categories/"
    weight = 3

[taxonomies]
  tag = "tags"
  category = "categories"

[caches]
  [caches.assets]
    maxAge = 0
  [caches.images]
    maxAge = 0

[markup]
  [markup.highlight]
    style = "github"
    noClasses = false
    lineNos = false

  [markup.goldmark.renderer]
    unsafe = true